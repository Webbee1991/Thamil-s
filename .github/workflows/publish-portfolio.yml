name: Publish digital portfolio (V7.2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digital-portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v4

      - name: Set up image tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate optimized portrait and social-sharing image
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          python scripts/build_assets.py

      - name: Persist generated images for both GitHub Pages modes
        run: |
          set -euo pipefail
          git add -- portrait.webp social-preview.png
          if git diff --cached --quiet; then
            echo "Portfolio images are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate optimized portrait and social preview [skip ci]"
            git push origin HEAD:main
          fi

      - name: Identify GitHub Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // "legacy"')"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages publishing mode: $mode"

      - name: Request a fresh branch-based Pages build
        if: steps.pages.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo "Requested a Pages build of the latest main branch."

      - name: Collect static website assets
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s nullglob
          cp -a -- *.html *.jpg *.jpeg *.JPG *.png *.webp *.pdf *.css *.js _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/portrait.webp
          test -f _site/social-preview.png

      - name: Configure GitHub Pages
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload portfolio site
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy portfolio site
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/deploy-pages@v4
